server:
  port: 8080

spring:
  application:
    name: danmaku
  datasource:
    url: jdbc:mysql://localhost:3306/danmaku?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

danmaku:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    polling:
      enabled: true
  worker:
    enabled: true
    batch-size: 50
    max-retry: 3
    processing-timeout-minutes: 5
  decision:
    min-confidence: 50
    symbol-rate-limit-seconds: 15
    duplicate-ttl-seconds: 60
  ai:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-turbo
    temperature: 0.4
    response-format: json_object

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8090/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: danmaku-executor
      ip:
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${XXL_JOB_LOG_PATH:/data/applogs/xxl-job}
      logretentiondays: 30
